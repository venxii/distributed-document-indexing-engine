services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: indexflow
      POSTGRES_PASSWORD: indexflow
      POSTGRES_DB: indexflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexflow -d indexflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

